name: Test

on:
  push:
    branches: [master, dev]
  pull_request:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # Only needed so `prisma generate` can load prisma.config.ts.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/intouch
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci --no-audit --no-fund
      - run: npx prisma generate
      - run: npm run build
      - run: npm test

  # Records a GitHub "production" deployment (shown in the repo sidebar and
  # Deployments tab) once tests pass on master. Dokploy does the actual deploy.
  # If the PRODUCTION_URL repository variable is set, the deployment links to it
  # and the job waits for its /health endpoint to answer.
  deploy:
    needs: test
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL }}
    steps:
      - name: Wait for production /health
        if: vars.PRODUCTION_URL != ''
        run: |
          for i in $(seq 1 30); do
            if curl -fsS "${{ vars.PRODUCTION_URL }}/health" > /dev/null; then
              echo "Production is healthy"; exit 0
            fi
            echo "Attempt $i failed, retrying in 10s"; sleep 10
          done
          echo "Production did not become healthy" >&2; exit 1
      - name: Record deployment
        run: echo "Deployed ${{ github.sha }} to production (Dokploy)"
