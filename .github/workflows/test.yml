name: Test

on:
  push:
    branches: [master, dev]
  pull_request:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # Only needed so `prisma generate` can load prisma.config.ts.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/intouch
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci --no-audit --no-fund
      - run: npx prisma generate
      - run: npm run build
      - run: npm test
